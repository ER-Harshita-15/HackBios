version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: netrax-db
    environment:
      POSTGRES_DB: netrax_db
      POSTGRES_USER: netrax
      POSTGRES_PASSWORD: netrax_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netrax -d netrax_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netrax-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://netrax:netrax_secret@db:5432/netrax_db
      DATABASE_URL_SYNC: postgresql://netrax:netrax_secret@db:5432/netrax_db
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netrax-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
